[project]
name = "nuwa-video-annotation-worker"
version = "0.1.0"
description = "Python GPU worker for video annotation pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2,<3",
    "huggingface-hub>=0.27,<2",
    "scenedetect>=0.6,<1",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
detect = [
    "lap>=0.5.12,<1",
    "numpy>=2,<3",
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "ultralytics>=8.3,<9",
]
semantic = [
    "numpy>=2,<3",
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "transformers==4.57.1",
    "accelerate>=1,<2",
    "qwen-vl-utils[decord]>=0.0.8,<1",
    "timm>=0.9,<2",
    "json-repair>=0.30,<1",
]
grounding = [
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "transformers==4.57.1",
    "accelerate>=1,<2",
    "timm>=0.9,<2",
    "peft==0.19.1",
    "decord==0.6.0",
    "lmdb==1.7.5",
]
ocr = [
    "numpy>=2,<3",
    "rapidocr>=3.8,<4",
    "onnxruntime>=1.19,<2",
]
audio = [
    "numpy>=2,<3",
    "torch>=2.4,<3",
    "transformers==4.57.1",
    "scipy>=1.12,<2",
]
depth = [
    "numpy>=2,<3",
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "transformers==4.57.1",
]
full = [
    "lap>=0.5.12,<1",
    "numpy>=2,<3",
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "transformers==4.57.1",
    "accelerate>=1,<2",
    "qwen-vl-utils[decord]>=0.0.8,<1",
    "decord==0.6.0",
    "timm>=0.9,<2",
    "peft==0.19.1",
    "lmdb==1.7.5",
    "ultralytics>=8.3,<9",
    "scipy>=1.12,<2",
    "json-repair>=0.30,<1",
    "rapidocr>=3.8,<4",
    "onnxruntime>=1.19,<2",
]

[project.scripts]
nuwa-worker = "nuwa_worker.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "config", "logging_utils", "pipeline", "worker"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nuwa_worker*", "providers*", "services*"]
