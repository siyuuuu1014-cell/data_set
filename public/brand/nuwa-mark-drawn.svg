<svg width="571" height="576" viewBox="0 0 571 576" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .color-flow-layer { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      .brand-artwork {
        animation:
          color-deepen 5.4s cubic-bezier(0.16, 1, 0.3, 1) 1 forwards,
          logo-breathe 6.8s cubic-bezier(0.45, 0, 0.55, 1) 5.4s infinite;
      }
      .color-flow-layer {
        display: block;
        opacity: 0;
        mix-blend-mode: overlay;
        animation:
          color-flow-enter 5.4s cubic-bezier(0.16, 1, 0.3, 1) forwards,
          color-flow-breathe 6.8s cubic-bezier(0.45, 0, 0.55, 1) 5.4s infinite;
      }
    }

    @keyframes color-deepen {
      0% {
        opacity: 0.28;
        filter: saturate(0.22) brightness(1.34);
      }
      52% {
        opacity: 0.7;
        filter: saturate(0.68) brightness(1.12);
      }
      100% {
        opacity: 1;
        filter: saturate(1) brightness(1);
      }
    }
    @keyframes color-flow-enter {
      from { opacity: 0; }
      to { opacity: 0.72; }
    }
    @keyframes color-flow-breathe {
      0%, 100% { opacity: 0.34; }
      50% { opacity: 0.88; }
    }
    @keyframes logo-breathe {
      0%, 100% {
        opacity: 1;
        filter: saturate(0.82) brightness(1.12);
      }
      50% {
        opacity: 1;
        filter: saturate(1.2) brightness(0.9);
      }
    }
  </style>

