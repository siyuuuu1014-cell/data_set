<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建项目 — Nuwa Layout Demo</title>
<style>:root{--pink:#FF6CCE;--pink-dark:#E04EB0;--pink-glow:rgba(255,108,206,0.2);--green:#CCED68;--green-dark:#A8D430;--bg:#FBFFF8;--bg-deep:#F2F8E8;--surface:#FFF;--border:#E8E0D5;--text:#3D3226;--text-dim:#8A7E70;--text-muted:#B5AA9D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(204,237,104,.10),transparent),radial-gradient(ellipse 60% 40% at 90% 80%,rgba(255,108,206,.06),transparent);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.08)}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.card h1{font-size:20px;font-weight:700;margin-bottom:4px}
.card .desc{font-size:13px;color:var(--text-dim);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:4px}
.form-group input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--bg);color:var(--text)}
.form-group input:focus{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-glow)}
.form-group .error{font-size:11px;color:var(--pink-dark);margin-top:4px}
.template-section{margin-bottom:20px}
.template-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template-card{padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;text-align:center;font-size:12px;color:var(--text-dim)}
.template-card:hover{border-color:var(--pink);color:var(--pink-dark);background:rgba(255,108,206,.04)}
.template-card.selected{border-color:var(--pink);background:rgba(255,108,206,.08);color:var(--pink-dark);font-weight:600}
.template-card .icon{font-size:24px;margin-bottom:4px;display:block}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-dim);transition:all .15s}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark),var(--green-dark));background-size:200% 200%;animation:shift 3s ease infinite;color:#fff;border:none;width:100%}
.btn.primary:hover{box-shadow:0 0 20px var(--pink-glow)}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
</style>
</head>
<body>
<div class="modal-bg" onclick="history.back()"></div>
<div class="card">
  <h1>新建合成数据项目</h1>
  <p class="desc">创建一个项目来组织你的数据表。</p>

  <div class="template-section">
    <h3>模板（可选）</h3>
    <div class="template-grid">
      <div class="template-card selected"><span class="icon">🆕</span>空白项目</div>
      <div class="template-card"><span class="icon">👤</span>用户画像</div>
      <div class="template-card"><span class="icon">🛒</span>电商订单</div>
      <div class="template-card"><span class="icon">📊</span>行为日志</div>
    </div>
  </div>

  <div class="form-group">
    <label>项目名称</label>
    <input type="text" placeholder="例如：user-study" value="" autofocus>
  </div>

  <div class="actions">
    <button class="btn primary">创建项目</button>
  </div>
</div>
</body>
</html>
