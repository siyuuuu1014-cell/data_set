<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Nuwa Layout Demo</title>
<style>
:root{--pink:#FF6CCE;--pink-dark:#E04EB0;--pink-glow:rgba(255,108,206,0.2);--green:#CCED68;--green-dark:#A8D430;--bg:#FBFFF8;--bg-deep:#F2F8E8;--surface:#FFF;--border:#E8E0D5;--text:#3D3226;--text-dim:#8A7E70;--text-muted:#B5AA9D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
/* Sidebar */
.sidebar{width:200px;border-right:1px solid var(--border);background:rgba(251,255,248,.5);flex-shrink:0;display:flex;flex-direction:column}
.sidebar-logo{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-logo .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--pink),var(--green));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.sidebar-logo span{font-weight:600;font-size:14px}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,108,206,.05);color:var(--pink)}
.nav-item.active{background:rgba(255,108,206,.08);color:var(--pink-dark);font-weight:600}
.nav-item .icon{font-size:15px;width:20px;text-align:center}
.back-link{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:4px}
.back-link:hover{color:var(--pink)}
/* Content */
.content{flex:1;overflow-y:auto;padding:32px 40px}
.content h2{font-size:20px;font-weight:700;margin-bottom:6px}
.content .desc{font-size:13px;color:var(--text-dim);margin-bottom:24px}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.form-section h3{font-size:14px;font-weight:600;margin-bottom:4px}
.form-section .hint{font-size:12px;color:var(--text-dim);margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:var(--bg);color:var(--text)}
.form-group input:focus,.form-group select:focus{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-glow)}
.preset-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.preset{padding:6px 14px;border-radius:8px;font-size:11px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-dim);transition:all .15s}
.preset:hover{border-color:var(--pink);color:var(--pink-dark)}
.preset.active{border-color:var(--pink);background:rgba(255,108,206,.08);color:var(--pink-dark);font-weight:600}
.actions{display:flex;gap:8px}
.btn{padding:8px 20px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-dim);transition:all .15s}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark),var(--green-dark));background-size:200% 200%;animation:shift 3s ease infinite;color:#fff;border:none}
.btn.primary:hover{box-shadow:0 0 20px var(--pink-glow)}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-top:12px}
.alert.success{background:rgba(204,237,104,.1);border:1px solid rgba(168,212,48,.3);color:#6B8C1E}
.alert.error{background:rgba(255,108,206,.06);border:1px solid rgba(255,108,206,.2);color:var(--pink-dark)}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo"><div class="logo">N</div><span>Nuwa</span></div>
  <div class="sidebar-nav">
    <button class="nav-item active"><span class="icon">⚙</span> LLM 配置</button>
    <button class="nav-item"><span class="icon">🧠</span> 语义 API</button>
    <button class="nav-item"><span class="icon">🚀</span> 部署配置</button>
    <button class="nav-item"><span class="icon">🔑</span> Hugging Face</button>
  </div>
  <a href="index.html" class="back-link">← 返回首页</a>
</nav>
<main class="content">
  <h2>LLM 配置</h2>
  <p class="desc">配置 LLM 服务以启用合成数据的 AI 文本生成和图像识别功能。</p>

  <div class="form-section">
    <h3>选择 Provider</h3>
    <div class="preset-grid">
      <button class="preset active">DeepSeek (Anthropic)</button>
      <button class="preset">DeepSeek (OpenAI)</button>
      <button class="preset">OpenAI</button>
      <button class="preset">Anthropic</button>
      <button class="preset">Ollama</button>
    </div>
  </div>

  <div class="form-section">
    <h3>API 设置</h3>
    <p class="hint">Provider 选择后将自动填入默认值。</p>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" placeholder="•••••• 已保存" value="">
    </div>
    <div class="form-group">
      <label>Base URL</label>
      <input type="text" value="https://api.deepseek.com/anthropic">
    </div>
    <div class="form-group">
      <label>Model</label>
      <input type="text" value="deepseek-chat">
    </div>
    <div class="actions">
      <button class="btn">测试连接</button>
      <button class="btn primary">保存配置</button>
    </div>
  </div>

  <div class="form-section">
    <h3>连接状态</h3>
    <div class="alert success">✓ DeepSeek 连接正常 · deepseek-chat · 上次测试: 2025-07-30 10:23</div>
  </div>
</main>
</body>
</html>
